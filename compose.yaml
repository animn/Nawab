services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - .env
    environment:
      NAWAB_DB_PATH: /data/learning_progress_v8.db
      NAWAB_MEDIA_DIR: /data/media
    volumes:
      - ./runtime-data:/data
    restart: unless-stopped
